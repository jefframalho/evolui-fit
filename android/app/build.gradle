plugins { id 'com.android.application' }
android {
    namespace 'br.com.evoluifit'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.evoluifit'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.preview'; debuggable true } }
}
