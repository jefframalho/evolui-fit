plugins { id 'com.android.application' }
android {
    namespace 'br.com.evoluifit'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.evoluifit'
        minSdk 26
        targetSdk 35
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '1.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.preview'; debuggable true } }
}

dependencies { implementation 'androidx.core:core:1.15.0' }
