name: Gerar APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar arquivo
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk evolui-fit.apk
          sha256sum evolui-fit.apk > evolui-fit.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: evolui-fit-android
          path: |
            evolui-fit.apk
            evolui-fit.apk.sha256
      - name: Publicar download Android
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const tag = 'android-latest';
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            const body = 'APK de teste do Evolui Fit para Android 8 ou superior. Abre o sistema online e precisa de internet. Não publicado na Play Store. Cada compilação usa uma assinatura de teste; pode ser necessário desinstalar a versão anterior antes de instalar uma nova. Os registros permanecem no Firebase da sua conta. Código: ' + context.sha;
            if (!release) release = (await github.rest.repos.createRelease({owner, repo, tag_name:tag, target_commitish:context.sha, name:'Evolui Fit — Android (teste)', body, prerelease:true})).data;
            else await github.rest.repos.updateRelease({owner, repo, release_id:release.id, name:'Evolui Fit — Android (teste)', body, prerelease:true});
            const old = await github.rest.repos.listReleaseAssets({owner, repo, release_id:release.id});
            for (const name of ['evolui-fit.apk', 'evolui-fit.apk.sha256']) {
              const existing = old.data.find(x => x.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id:existing.id});
              const data = fs.readFileSync(name);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id:release.id, name, data, headers:{'content-type':name.endsWith('.apk')?'application/vnd.android.package-archive':'text/plain', 'content-length':data.length}});
            }
